[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-agent-test"
version = "0.1.0"
description = "自然语言驱动的多端自动化测试平台：首跑 AI 接管，之后只跑脚本"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "PyYAML>=6.0", "pillow>=10.0"]

[project.optional-dependencies]
web = ["playwright>=1.44"]
windows = ["uiautomation>=2.0"]
vision = ["pyautogui>=0.9.54", "opencv-python>=4.9"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
atp = "atp.cli:main"

[tool.setuptools.packages.find]
include = ["atp*"]

[tool.setuptools.package-data]
atp = ["../atp.config.json"]
"atp.webapp" = ["static/*"]
